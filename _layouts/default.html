<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
        <meta name="description" content="{{ page.description | default: site.description }}">
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M5.5 4h5v1.1H6.835v2.1h3.3v1.1h-3.3v2.6H10.5V12h-5z'/%3E%3Cpath d='M0 2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm15 0a1 1 0 0 0-1-1H2a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1z'/%3E%3C/svg%3E">

        <script>
            (function(){
                var t;
                try { t = localStorage.getItem('theme'); } catch(e) {}
                if(t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.setAttribute('data-bs-theme', t);
            })();
        </script>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

        <link rel="stylesheet" href="/style/style.css">
        <link rel="stylesheet" href="/style/blog.css">
    </head>

    <body class="blog-page">
        {% include nav.html %}

        <main class="blog-main">
            <div class="container blog-container">
                {{ content }}
            </div>
        </main>

        <footer class="footer">
            © 2026 Elian Alderuccio
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/script/i18n.js"></script>
        <script src="/script/theme.js"></script>
    </body>
</html>
